name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rusty
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rusty.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rusty
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename artifact
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/rusty-${{ matrix.target }}${{ endsWith(matrix.bin, '.exe') && '.exe' || '' }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*