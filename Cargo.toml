[package]
name = "rusty"
version = "0.0.0"
edition = "2024"

[dependencies]
twilight-gateway = "0.16"
twilight-http = "0.16"
twilight-model = "0.16"
twilight-util = { version = "0.16", features = ["builder"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
